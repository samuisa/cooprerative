name: Mirror to Codeberg

on:
  push:
    branches: [ "*" ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push su Codeberg
        run: |
          git remote add codeberg https://samuisa:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/samuisa/NOME_REPO_CODEBERG.git
          git push codeberg --all --force
